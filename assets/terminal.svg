<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300">
  <style>
    text { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; font-size: 15px; fill: #c9d1d9; white-space: pre; }
    .user { fill: #3fb950; font-weight: 700; }
    .path { fill: #58a6ff; font-weight: 700; }
    .dim  { fill: #8b949e; }
    .ok   { fill: #3fb950; font-weight: 700; }
    .amb  { fill: #d29922; }
    .title { fill: #8b949e; font-size: 13px; }
  </style>

  <defs>
    <clipPath id="c1"><rect x="0" y="50" height="30" width="132">
      <animate attributeName="width" from="132" to="860" begin="0.4s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="0" y="114" height="30" width="132">
      <animate attributeName="width" from="132" to="860" begin="2.0s" dur="1.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="0" y="178" height="30" width="132">
      <animate attributeName="width" from="132" to="860" begin="4.2s" dur="1.0s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- janela -->
  <rect x="1" y="1" width="858" height="298" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M1 9a8 8 0 0 1 8-8h842a8 8 0 0 1 8 8v27H1z" fill="#161b22"/>
  <line x1="1" y1="36" x2="859" y2="36" stroke="#30363d" stroke-width="1"/>
  <circle cx="22" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="19" r="6" fill="#27c93f"/>
  <text x="430" y="23" text-anchor="middle" class="title">juan@root: ~ — zsh — 80x24</text>

  <!-- 1: whoami -->
  <text x="24" y="70" clip-path="url(#c1)"><tspan class="user">juan@root</tspan>:<tspan class="path">~</tspan>$ whoami</text>

  <!-- 2 -->
  <text x="24" y="96" opacity="0">juan fernandes — dev full-stack que gosta de descer até o metal
    <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.01s" fill="freeze"/></text>

  <!-- 3: filosofia -->
  <text x="24" y="134" opacity="0" clip-path="url(#c3)"><tspan class="user">juan@root</tspan>:<tspan class="path">~</tspan>$ cat /etc/filosofia
    <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.01s" fill="freeze"/></text>

  <!-- 4 -->
  <text x="24" y="160" opacity="0"><tspan class="amb">"What I cannot create, I do not understand."</tspan><tspan class="dim">  — R. Feynman</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="3.3s" dur="0.01s" fill="freeze"/></text>

  <!-- 5: build -->
  <text x="24" y="198" opacity="0" clip-path="url(#c5)"><tspan class="user">juan@root</tspan>:<tspan class="path">~</tspan>$ make everything --from-scratch
    <animate attributeName="opacity" from="0" to="1" begin="3.9s" dur="0.01s" fill="freeze"/></text>

  <!-- 6 -->
  <text x="24" y="224" opacity="0"><tspan class="ok">[ok]</tspan> sem caixa-preta. sem mágica. só syscalls, bytes e paciência.
    <animate attributeName="opacity" from="0" to="1" begin="5.6s" dur="0.01s" fill="freeze"/></text>

  <!-- 7: prompt + cursor -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="6.1s" dur="0.01s" fill="freeze"/>
    <text x="24" y="262"><tspan class="user">juan@root</tspan>:<tspan class="path">~</tspan>$ </text>
    <rect x="141" y="249" width="9" height="17" fill="#c9d1d9">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
